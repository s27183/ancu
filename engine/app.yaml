# DigitalOcean App Platform spec — Mai An Cư engine (deployment.md §3/§4).
#
# Deploy:  bash scripts/do_apply.sh engine   (fills the secrets from .env, validates
#          with /v2/apps/propose, creates or updates the app — scripts/do_deploy.py)
# Check:   python3 scripts/do_deploy.py propose engine   (read-only, no .env)
#
# The engine owns an App Platform DEV database (`databases:` below, PG 16, ~US$7/mo):
# one database, reachable only from this app, no backups, destroyed with the app;
# "Convert to a Managed Database" upgrades it in place (behavior 33, Son 2026-10-09).
# Because nothing outside the app can reach it, the shell's tenant public key is
# registered by the engine itself at boot (SHELL_TENANT_ID / SHELL_TENANT_PUBKEY).
#
# Region `syd`: the users of maiancu.com are in Australia.

name: ancu-engine
region: syd
databases:
  - name: db
    engine: PG
    version: "16"
    production: false
services:
  - name: engine
    # Build context = repo root so the Dockerfile can reach docs/ (KB sources),
    # engine/build/ (compiler), and repo-root pyproject.toml/uv.lock.
    source_dir: /
    dockerfile_path: engine/Dockerfile
    github:
      repo: s27183/ancu
      branch: main
      deploy_on_push: true
    http_port: 8080
    # Heavier of the two apps — carries the per-turn Python Agent-SDK subprocess.
    # 1 vcpu / 1 GB fixed, US$10/mo (GET /v2/apps/tiers/instance_sizes, 2026-10-09).
    # Unmeasured under a turn: an OOM in the run log means apps-s-1vcpu-2gb ($25).
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    instance_count: 1
    health_check:
      http_path: /health
      # Boot runs migrations + loads the KB artifact before serving — a short delay
      # avoids a boot-time health flap.
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      # ── Config (non-secret; committed) ──────────────────────────────────────────
      - key: FH_ENGINE_HTTP_PORT
        value: "8080"
      - key: FH_SIDECAR_PYTHON
        value: "python3"
      - key: FH_PLANNER_SCRIPT
        value: "/app/engine/python/planner.py"
      # Audit-trail commit SHA (constraint #6). DO does NOT auto-inject the git SHA;
      # set it per build (CI: --build-arg FH_DEPLOY_COMMIT_SHA=$(git rev-parse HEAD))
      # or leave the image default "unknown" for plain deploy_on_push (deployment.md §6).
      - key: FH_DEPLOY_COMMIT_SHA
        value: "unknown"
      # The dev database's URL (?sslmode=require), bound by App Platform at run time.
      - key: ENGINE_DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # The shell's tenant: the engine registers this public key at boot (idempotent),
      # so the shell's JWTs verify. Not secret — the private half stays in the shell.
      # do_apply fills both from .env (the public key derived from SHELL_TENANT_PRIVKEY).
      - key: SHELL_TENANT_ID
        value: ""
      - key: SHELL_TENANT_PUBKEY
        value: ""
      # ── Secrets (filled from .env by scripts/do_deploy.py) ───────────────────────
      # Anthropic Max-subscription credit for the Agent-SDK planner (the prod runner;
      # billing.md). The native `claude` binary authes off this; the planner blanks
      # ANTHROPIC_API_KEY in the SDK subprocess so this token wins.
      - key: CLAUDE_CODE_OAUTH_TOKEN
        type: SECRET
      # Optional cash-billed fallback / shadow-costing path only.
      - key: ANTHROPIC_API_KEY
        type: SECRET
      # ── Intentionally UNSET in prod ─────────────────────────────────────────────
      # ENGINE_DEV_PROVISION — the dev-only POST /api/engine/dev/tenants endpoint must
      # stay 404 in prod. The prod tenant key comes from SHELL_TENANT_PUBKEY above.
      # Do NOT add it here.
      #
      # The engine needs NO CORS (no browser hits it directly — the suburb map is
      # proxied through the shell). Tenant PUBLIC keys live in the engine DB
      # (tenant_signing_keys), not env.

# No custom domain: only the shell calls the engine, at its *.ondigitalocean.app
# ingress (do_deploy.py hands it to the shell as ENGINE_BASE_URL).
