# DigitalOcean App Platform spec — FirstHomey shell backend (deployment.md §3/§4).
#
# Deploy:  doctl apps spec validate --spec shell/web/app.yaml
#          doctl apps create --spec shell/web/app.yaml
#
# Shares the firsthomey-pg cluster (provisioned out-of-band; see engine/app.yaml)
# but a DIFFERENT database — firsthomey_shell — via SHELL_DATABASE_URL (set manually;
# DO doesn't cross-inject DB refs across apps). HTTP-only to the engine; never a
# cross-DB JOIN (constraint #11 / engine-contract §9.2).

name: firsthomey-shell
region: sgp
services:
  - name: shell
    source_dir: shell/web
    dockerfile_path: shell/web/Dockerfile
    github:
      # TODO(operator): set to your GitHub repo (FH has no remote yet).
      repo: <github-owner>/firsthomey
      branch: main
      deploy_on_push: true
    http_port: 8081
    # Cowboy + pgo only — the lighter app. ≈ 1 vcpu / 1 GB. Confirm slug with
    # `doctl apps tier instance-size list`.
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    instance_count: 1
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      # ── Config (non-secret; committed) ──────────────────────────────────────────
      - key: FH_SHELL_HTTP_PORT
        value: "8081"
      # The engine's public base URL the shell calls server-side. BEFORE DNS lands,
      # override to the engine app's *.ondigitalocean.app ingress, then revert to the
      # apex once DNS is up (deployment.md §4 step 6).
      - key: ENGINE_BASE_URL
        value: "https://engine.firsthomey.com.au"  # <apex> placeholder
      # Base for magic-link + Google redirect URIs and the SPA origin. The browser
      # only ever talks to this origin; /api/* is proxied here by a Pages Function.
      - key: APP_BASE_URL
        value: "https://app.firsthomey.com.au"  # <apex> placeholder
      # fh_session gets Secure in prod (HTTPS-only). Host-only, SameSite=Lax cookie.
      - key: COOKIE_SECURE
        value: "1"
      # Magic-link sender — must be on the Resend-verified domain (deployment.md §4 step 8).
      - key: EMAIL_FROM
        value: "no-reply@firsthomey.com.au"  # <apex> placeholder
      - key: EMAIL_FROM_NAME
        value: "FirstHomey"
      # Stripe API base — live default; explicit for clarity. (Tests override it to a
      # stub; never set the stub value in prod.)
      - key: STRIPE_API_BASE
        value: "https://api.stripe.com"
      # doc_review add-on price in cents ($40). Optional — the code defaults to 4000.
      - key: ADDON_AMOUNT_DOC_REVIEW
        value: "4000"
      # Admin allowlist (config, comma-separated — emails aren't secret). Left empty
      # in-repo; set the real list in the Dashboard to avoid committing addresses.
      # Admins are charge-exempt (billed=false) but still metered (8-S5e).
      - key: ADMIN_EMAILS
        value: ""
      # ── Secrets (set in DO Dashboard → Settings → Environment Variables) ─────────
      # firsthomey_shell on the shared cluster, ?sslmode=require (deployment.md §4 step 6).
      - key: SHELL_DATABASE_URL
        type: SECRET
      # User-JWT HMAC (openssl rand -hex 32).
      - key: SHELL_JWT_SECRET
        type: SECRET
      # ed25519 tenant identity. PRIVKEY is base64 of the private key; its PUBLIC half
      # is registered with the engine out-of-band (deployment.md §4 step 5).
      - key: SHELL_TENANT_ID
        type: SECRET
      - key: SHELL_TENANT_PRIVKEY
        type: SECRET
      # re_… → magic-link emails via Resend; unset → link logged (DO log stream).
      - key: RESEND_API_KEY
        type: SECRET
      # Google OAuth — redirect URI https://app.<apex>/api/auth/google/callback.
      - key: GOOGLE_CLIENT_ID
        type: SECRET
      - key: GOOGLE_CLIENT_SECRET
        type: SECRET
      # Stripe commerce (8-S5e/8-S5f). Subscriptions need recurring Price ids;
      # webhook needs the signing secret.
      - key: STRIPE_SECRET_KEY
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        type: SECRET
      - key: STRIPE_PRICE_PLUS
        type: SECRET
      - key: STRIPE_PRICE_PRO
        type: SECRET
      # ── Intentionally UNSET in prod ─────────────────────────────────────────────
      # SHELL_DEV_AUTOPROVISION — else the shell mints an ephemeral tenant key instead
      #   of using the static SHELL_TENANT_PRIVKEY (the out-of-band-registered one).
      # AUTH_DEV_EXPOSE_LINK — dev-only magic-link echo.
      # GOOGLE_TOKEN_URL — test-stub override; unset → real Google token endpoint.
      # Do NOT add these here.

domains:
  - domain: api.firsthomey.com.au  # <apex> placeholder — substitute your real apex
    type: PRIMARY
