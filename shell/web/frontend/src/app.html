<!doctype html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- = app.css --bg / --chrome: the browser paints its bars in this (behavior 63). -->
        <meta name="theme-color" content="#f6f4ef" />
        <!-- Behavior 152: installable — the manifest (static/manifest.webmanifest) and the
             iPhone's home-screen icon and name; display only, no new scope or permission. -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Mai An Cư" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <style>
            /* Behavior 137: the page's text for crawlers (scripts/seo.ts); the app shows it once script runs. */
            .js #seo-static { display: none; }
        </style>
        <script>
            document.documentElement.classList.add('js');
            // Apply the persisted language to <html> before first paint (no flicker).
            // Default is vi (the product is VI-first; bilingual-content.md). localStorage
            // can throw in private mode — swallow and keep the markup default.
            (function () {
                try {
                    var l = localStorage.getItem('ancu-lang');
                    if (l) document.documentElement.setAttribute('lang', l);
                } catch (e) {}
            })();
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
