[project]
name = "firsthomey"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk", # the planning-sidecar runner (agentic-flow §7/§7.1); draws subscription credit
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.4",
    "pydantic", # outcome_schema validation of leaf-fill structured output
    "pypdf>=5.0", # due_diligence B: deterministic lease PDF -> text (no LLM); bytes transient
    "xlrd>=2.0", # build-time only: reads VIC VPSR legacy .xls (BIFF); openpyxl is .xlsx-only
]

[dependency-groups]
deploy = [
    "pyyaml>=6.0.3",
]

[tool.uv]
# Behavior 144: mcp comes in through claude-agent-sdk. 1.29.0 carries GHSA-5h93-6whr-6q8j,
# GHSA-84m7-p3x7-pcfv, GHSA-rwrf-2pqf-9j8j and GHSA-w4fh-qvv9-3v23, all fixed in 1.30.0;
# a re-lock never falls back below it. <2: mcp 2.x is a major the SDK is not measured on here.
constraint-dependencies = ["mcp>=1.30.0,<2"]
