# Regulated figures are grounded -> P-7 -> The KB update -> a verified KB update publishes itself; the rest is held for Son
# Behavior 74 (Son 2026-10-12). On every kb-watch PR (branch kb-watch-*): wait for the
# required "done checks" on its head, ask scripts/kb_gate.py whether the PR may merge
# itself (its block says when; a push clears kb-verify's labels first), and say so
# in one comment it keeps up to date. LIVE was "no" for two dry-run weeks
# (2026-10-12..26: "would merge" on #164, #168, #169, #170, #174, a kb-hold on #176 —
# Son merged each himself). "yes" is the Irreversible step of behavior 74: a merge
# here deploys (deployment.md: main deploys on push); setting it back to "no" is the
# way back, and a bad figure is undone by a revert PR.
#
# The rules that judge a PR are never the PR's own: the gate's code (kb_gate.py and
# what it imports) is checked out at the base commit, and the PR's head is only read
# through git (`git show <head>:<path>`). A PR editing scripts/ is held as outside
# docs/kb either way; this keeps a rewritten kb_gate.py from deciding its own merge.
# For the same reason the trigger is pull_request_target: GitHub runs this workflow
# as it stands on main, so a PR that edits kb-gate.yml is judged by main's copy, not
# its own (on `pull_request` the PR's merge ref supplies the workflow file). Nothing
# from the head is executed.
name: kb gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

env:
  LIVE: "yes"

permissions:
  contents: write
  pull-requests: write
  checks: read
  issues: write

concurrency:
  group: kb-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: startsWith(github.head_ref, 'kb-watch-')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BRANCH: ${{ github.head_ref }}
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch the PR head (read through git only)
        run: git fetch --no-tags origin "$HEAD_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # kb-verify's label speaks for the commit it checked: a new push clears it, so a
      # verified PR that then changes waits for kb-verify again. Fails closed: if the
      # labels cannot be cleared, nothing below runs and nothing merges.
      - name: Clear verdict labels on a new push
        if: github.event.action == 'synchronize'
        run: |
          gh pr edit "$PR" --remove-label kb-verified --remove-label kb-hold

      # The done checks run in their own workflow on the same head; wait for their result.
      - name: Wait for the done checks
        id: checks
        run: |
          ok=no
          for i in $(seq 1 90); do
            res=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs?check_name=done%20checks" \
                    --jq '[.check_runs[] | select(.status=="completed") | .conclusion] | first // ""')
            if [ -n "$res" ]; then [ "$res" = success ] && ok=yes; break; fi
            sleep 30
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Decide
        run: |
          labels="$LABELS"
          [ "${{ github.event.action }}" = synchronize ] && labels=""
          python3 scripts/kb_gate.py --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$BRANCH" \
            --labels "$labels" --checks-ok "${{ steps.checks.outputs.ok }}" --live "$LIVE" --out "$RUNNER_TEMP/gate" --pr "$PR"
          echo "decision=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["decision"])' "$RUNNER_TEMP/gate/decision.json")" >> "$GITHUB_ENV"

      - name: Comment
        run: gh pr comment "$PR" --edit-last --body-file "$RUNNER_TEMP/gate/comment.md" || gh pr comment "$PR" --body-file "$RUNNER_TEMP/gate/comment.md"

      # One issue per held PR, assigned to Son, kept current on each re-run.
      - name: File Son's issue
        if: env.LIVE == 'yes' && env.decision == 'hold'
        run: |
          title="kb-gate: #$PR held"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
                --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file "$RUNNER_TEMP/gate/issue.md"
          else
            gh issue create --title "$title" --assignee s27183 --body-file "$RUNNER_TEMP/gate/issue.md"
          fi

      - name: Merge
        if: env.LIVE == 'yes' && env.decision == 'merge'
        run: gh pr merge "$PR" --merge --match-head-commit "$HEAD_SHA"
