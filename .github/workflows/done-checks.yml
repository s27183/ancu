# Reproducible -> P-7 · One declaration per outcome shape -> Mechanisms -> the done checks, run by CI
# main deploys on every push (deployment.md §4), so this job is the gate before a deploy:
# a ruleset on main requires the status "done checks" (behavior 38, 2026-10-09). It runs
# architecture.md's `checks:` line through scripts/done_checks.sh — never a copy of it —
# after building what a clean checkout lacks (.venv, the KB artifact, node_modules).
# Toolchain = the dev seat's, measured 2026-10-09: OTP 29.1.1 / rebar3 3.27.0, Node 26,
# Python per uv.lock (requires-python >=3.14). Offline checks only: no Postgres, no keys.
# One exception (behavior 145, Son 2026-10-31): a same-repo kb-watch-* PR is checked by the
# local gate on Son's Mac (docs/architecture/auto-jobs.md), which runs this same script at
# the head sha before it merges; here that job is skipped, which the ruleset counts as passed.
name: done checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: done-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  done-checks:
    name: done checks
    # A same-repo kb-watch-* PR is the local gate's: it ran these checks on Son's Mac at the
    # head sha before merging (scripts/auto/gate.py, behavior 145). A job skipped by `if:`
    # reports success to main's required "done checks"; a fork's PR or any other head runs.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
      || !startsWith(github.event.pull_request.head.ref, 'kb-watch-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          rebar3-version: "3.27.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: shell/web/frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: Python deps (uv.lock)
        run: uv sync --frozen

      - name: KB artifact
        run: .venv/bin/python engine/build/kb_compiler.py

      - name: Frontend deps
        working-directory: shell/web/frontend
        run: npm ci

      - name: Done checks (architecture.md `checks:`)
        run: bash scripts/done_checks.sh
